<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meme Crash Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            font-family: 'Arial', sans-serif;
            transition: background-color 1s ease;
            overflow: hidden;
        }

        #game-container {
            text-align: center;
            position: relative;
            width: 100%;
        }

        #multiplier {
            font-size: 80px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        #zone-name {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.3);
            padding: 5px 20px;
            border-radius: 20px;
        }

        #rocket {
            font-size: 100px;
            margin: 40px 0;
            display: inline-block;
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(5deg); }
            50% { transform: translateY(-20px) rotate(-5deg); }
        }

        .controls {
            margin-top: 30px;
        }

        button {
            padding: 15px 50px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #27ae60;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px #1e8449;
            transition: all 0.1s;
        }

        button:active {
            box-shadow: 0 2px #1e8449;
            transform: translateY(3px);
        }

        button:disabled {
            background-color: #7f8c8d;
            box-shadow: 0 5px #95a5a6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="zone-name">Ожидание взлета...</div>
        <div id="multiplier">1.00x</div>
        <div id="rocket">🚀</div>
        
        <div class="controls">
            <button id="action-btn" onclick="handleAction()">ВЗЛЕТ</button>
        </div>
    </div>

    <script>
        const zones = [
            { name: "Doge Zone 🐕", color: "#f3ce5e", threshold: 1.0, speed: 0.01 },
            { name: "Pepe Zone 🐸", color: "#3faf33", threshold: 2.5, speed: 0.04 },
            { name: "Shiba Zone 🐕‍🦺", color: "#ff8a00", threshold: 6.0, speed: 0.10 },
            { name: "Moon Mission 🌕", color: "#000000", threshold: 12.0, speed: 0.25 }
        ];

        let multiplier = 1.0;
        let isFlying = false;
        let currentZoneIndex = 0;
        let gameInterval;

        const btn = document.getElementById('action-btn');
        const multDisplay = document.getElementById('multiplier');
        const zoneDisplay = document.getElementById('zone-name');

        function handleAction() {
            if (!isFlying) {
                startFlight();
            } else {
                cashOut();
            }
        }

        function startFlight() {
            isFlying = true;
            multiplier = 1.0;
            currentZoneIndex = 0;
            btn.innerText = "ЗАБРАТЬ";
            btn.style.backgroundColor = "#e67e22";
            btn.style.boxShadow = "0 5px #d35400";
            
            // Генерируем момент краша заранее (для честности)
            const crashPoint = (Math.random() * 15 + 1).toFixed(2);
            console.log("Crash at:", crashPoint);

            gameInterval = setInterval(() => {
                let zone = zones[currentZoneIndex];
                multiplier += zone.speed;

                // Проверка зон
                if (currentZoneIndex < zones.length - 1) {
                    if (multiplier >= zones[currentZoneIndex + 1].threshold) {
                        currentZoneIndex++;
                    }
                }

                // Обновление экрана
                multDisplay.innerText = multiplier.toFixed(2) + "x";
                zoneDisplay.innerText = zones[currentZoneIndex].name;
                document.body.style.backgroundColor = zones[currentZoneIndex].color;

                // Проверка краша
                if (multiplier >= crashPoint) {
                    crash();
                }
            }, 50);
        }

        function cashOut() {
            stopGame();
            alert("Победа! Ты забрал: " + multiplier.toFixed(2) + "x");
            resetGame();
        }

        function crash() {
            stopGame();
            document.getElementById('rocket').innerText = "💥";
            document.body.style.backgroundColor = "#c0392b";
            alert("КРАШ! Множитель: " + multiplier.toFixed(2) + "x");
            resetGame();
        }

        function stopGame() {
            isFlying = false;
            clearInterval(gameInterval);
        }

        function resetGame() {
            btn.innerText = "ВЗЛЕТ";
            btn.style.backgroundColor = "#27ae60";
            btn.style.boxShadow = "0 5px #1e8449";
            document.getElementById('rocket').innerText = "🚀";
            multDisplay.innerText = "1.00x";
            zoneDisplay.innerText = "Готов к полету?";
            document.body.style.backgroundColor = "#2c3e50";
        }
    </script>
</body>
</html>
