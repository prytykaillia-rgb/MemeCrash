<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meme Crash Live</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --accent-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.8s ease;
            overflow: hidden;
        }

        #game-ui {
            text-align: center;
            z-index: 2;
        }

        #multiplier {
            font-size: 5rem;
            font-weight: 800;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }

        #status-tag {
            font-size: 1.2rem;
            text-transform: uppercase;
            padding: 5px 15px;
            border-radius: 50px;
            background: rgba(255,255,255,0.1);
            margin-bottom: 20px;
            display: inline-block;
        }

        #rocket-container {
            font-size: 120px;
            margin: 30px 0;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
            transition: transform 0.2s ease;
        }

        .flying {
            animation: shake 0.5s infinite alternate ease-in-out, float 3s infinite ease-in-out;
        }

        @keyframes shake {
            from { transform: rotate(3deg); }
            to { transform: rotate(-3deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        .controls {
            margin-top: 40px;
        }

        #cashout-btn {
            padding: 18px 60px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background: #27ae60;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px #1e8449;
            display: none; /* Скрыта по умолчанию */
        }

        #cashout-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px #1e8449;
        }
    </style>
</head>
<body>

    <div id="game-ui">
        <div id="status-tag">Подключение...</div>
        <div id="multiplier">1.00x</div>
        <div id="rocket-container">🚀</div>
        
        <div class="controls">
            <button id="cashout-btn" onclick="handleCashOut()">ЗАБРАТЬ</button>
        </div>
    </div>

    <script>
        // !!! ЗАМЕНИ ЭТОТ IP НА IP СВОЕГО СЕРВЕРА !!!
        const SERVER_IP = '89.22.236.106'; 
        const socket = new WebSocket(`ws://89.22.236.106:8000/ws`);

        const multDisplay = document.getElementById('multiplier');
        const statusTag = document.getElementById('status-tag');
        const rocket = document.getElementById('rocket-container');
        const btn = document.getElementById('cashout-btn');

        socket.onopen = () => {
            statusTag.innerText = "Ожидание раунда";
            console.log("Connected to server");
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const val = data.multiplier;
            
            multDisplay.innerText = val.toFixed(2) + "x";

            if (data.status === "waiting") {
                updateUI("waiting", "#2c3e50", "Прием ставок...");
            } 
            else if (data.status === "flying") {
                updateUI("flying");
                // Логика смены зон мем-коинов
                if (val < 2.0) {
                    document.body.style.backgroundColor = "#f3ce5e"; // Doge
                    statusTag.innerText = "DOGE ZONE 🐕";
                } else if (val < 5.0) {
                    document.body.style.backgroundColor = "#3faf33"; // Pepe
                    statusTag.innerText = "PEPE ZONE 🐸";
                } else {
                    document.body.style.backgroundColor = "#ff8a00"; // Shiba
                    statusTag.innerText = "SHIBA ZONE 🐕‍🦺";
                }
            } 
            else if (data.status === "crashed") {
                updateUI("crashed", "#c0392b", "КРАШ! 💥");
            }
        };

        function updateUI(state, color, text) {
            if (state === "waiting") {
                rocket.innerHTML = "🚀";
                rocket.className = "";
                document.body.style.backgroundColor = color;
                statusTag.innerText = text;
                btn.style.display = "none";
            } 
            else if (state === "flying") {
                rocket.className = "flying";
                btn.style.display = "inline-block";
            } 
            else if (state === "crashed") {
                rocket.innerHTML = "💥";
                rocket.className = "";
                document.body.style.backgroundColor = color;
                statusTag.innerText = text;
                btn.style.display = "none";
            }
        }

        function handleCashOut() {
            // Здесь будет логика отправки запроса на сервер для фиксации выигрыша
            alert("Вы нажали забрать на " + multDisplay.innerText);
            btn.style.display = "none";
        }

        socket.onerror = (error) => {
            statusTag.innerText = "Ошибка соединения";
            statusTag.style.backgroundColor = "red";
        };
    </script>
</body>
</html>
